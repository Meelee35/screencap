[package]
name = "screencap"
version = "2026.10.1"
edition = "2024"

[dependencies]
thiserror = "2.0.21"
zbus = "5.19.0"
os_pipe = "1.2.3"
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png"] }
slint = { version = "1.18.1", features = ["backend-qt"] }
clap = { version = "4.6.7", features = ["derive"] }
confy = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
notify-rust = { version = "4.18.2", features = ["images_no_default_features"] }

[build-dependencies]
slint-build = "1"

[profile.dev.package."*"]
opt-level = 3
